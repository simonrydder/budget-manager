name: Release

# When CI passes on prod, the version in pyproject.toml becomes a GitHub release (tag v1.2.3)
# with its CHANGELOG.md section as the notes. A version that is already released is skipped,
# so merges that do not change the version add nothing.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [prod]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Version $version is already released."
            exit 0
          fi
          # The CHANGELOG.md section of this version, without its heading.
          awk -v version="$version" '/^## / { this = ($2 == version); next } this' CHANGELOG.md > notes.md
          gh release create "v$version" --target "$SHA" --title "$version" --notes-file notes.md
