{% extends "ledger/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password for {{ person.username }}</h1></div></div>
<form method="post" class="form card flat">
  {% csrf_token %}
  {% for field in form %}{% include "ledger/_field.html" %}{% endfor %}
  <div class="form-actions"><button class="btn primary">Change password</button><a class="btn" href="{% url 'users' %}">Cancel</a></div>
</form>
{% endblock %}
