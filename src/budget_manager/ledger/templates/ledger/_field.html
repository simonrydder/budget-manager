<div class="field{% if field.errors %} invalid{% endif %}">
  {% if field.widget_type == "checkbox" %}
    <label class="row" style="gap:8px;font-weight:600">{{ field }} {{ field.label }}</label>
  {% elif field.widget_type == "radioselect" %}
    <fieldset class="choices"><legend>{{ field.label }}</legend>{{ field }}</fieldset>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}
</div>
