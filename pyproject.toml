[project]
name = "budget-manager"
version = "1.6.0"
description = "Self-hosted budget manager for the home network"
readme = "README.md"
authors = [{ name = "simonrydder" }]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "waitress>=3.0",
    "whitenoise>=6.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "budget_manager.web.settings"

[project.scripts]
budget-manager = "budget_manager:main"

[build-system]
requires = ["uv_build>=0.8.1,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.8.3",
    "freezegun>=1.5",
    "pytest>=8.4.1",
    "pytest-django>=4.9",
    "ruff>=0.12.4",
]
